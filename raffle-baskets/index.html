<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- see index.html: .reveal content stays visible unless JS confirms it can animate -->
<script>
if(window.IntersectionObserver&&!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
  document.documentElement.className+=' js-anim';
  setTimeout(function(){
    var e=document.querySelectorAll('.reveal:not(.in)');
    for(var i=0;i<e.length;i++){ e[i].className+=' in'; }
  },4000);
}
</script>
<title>Raffle Baskets · Week of Sports 26-27</title>
<meta name="description" content="Week of Sports raffle baskets — enter to win and support the Andrew Walker Memorial Scholarship at Liberty-Benton.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Week of Sports">
<meta property="og:title" content="Raffle Baskets · Week of Sports 26-27">
<meta property="og:description" content="Enter to win this year's raffle baskets and support the Andrew Walker Memorial Scholarship.">
<meta property="og:url" content="https://weekofsports.com/raffle-baskets/">
<meta property="og:image" content="https://weekofsports.com/assets/share-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://weekofsports.com/assets/share-card.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a2342">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="/assets/pwa.js" defer></script>
<link rel="stylesheet" href="/assets/site.css">
<script src="/config.js"></script>
</head>
<body>
<main>
  <section class="page-head"><div class="wrap inner">
    <div class="eyebrow">Win big, give back</div>
    <h1>Raffle Baskets</h1>
    <p>Baskets donated by local families and businesses — every ticket you buy supports the scholarship.</p>
  </div></section>

  <section class="section light">
    <div class="wrap">
      <div class="baskets" id="baskets"></div>
      <p class="note" id="raffle-note"></p>
      <div class="center-cta"><button class="btn btn-primary" onclick="openVenmo()">Buy tickets via Venmo</button></div>
    </div>
  </section>
</main>

<script>
  window.renderPage = function(C){
    var b = (C.raffleBaskets||[]);
    document.getElementById('baskets').innerHTML = b.length ? b.map(function(x){
      return '<div class="basket reveal"><div class="bval">'+(x.value||'')+' value</div><h3>'+x.name+'</h3><p>'+(x.items||'')+'</p></div>';
    }).join('') : '<p style="grid-column:1/-1;text-align:center;color:#6a7a8f;font-size:16px">This year’s raffle baskets are coming soon — check back as game day approaches!</p>';
    document.getElementById('raffle-note').textContent = C.raffleNote || '';
  };
</script>
<script src="/assets/page.js"></script>
</body>
</html>
